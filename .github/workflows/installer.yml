name: windows-installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "arrow_assistant/**", "requirements.txt", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Build Arrow.exe (bundles Python 3.12)
        working-directory: packaging
        run: pyinstaller arrow.spec --noconfirm --distpath ..\dist --workpath ..\build
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\Arrow\Arrow.exe -ArgumentList "--self-test","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build ArrowSetup.exe
        shell: pwsh
        run: |
          $v = python -c "import arrow_assistant; print(arrow_assistant.__version__)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\ArrowSetup-*.exe
      - name: Silent install + uninstall check
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\ArrowSetup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\Arrow Assistant\Arrow.exe"
          if (-not (Test-Path $exe)) { Write-Error "not installed"; exit 1 }
          $t = Start-Process $exe -ArgumentList "--self-test","installed.txt" -Wait -PassThru
          Get-Content installed.txt
          if ($t.ExitCode -ne 0) { exit 1 }
          $un = Start-Process "$env:LOCALAPPDATA\Programs\Arrow Assistant\unins000.exe" -ArgumentList "/VERYSILENT" -Wait -PassThru
          if ($un.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowSetup
          path: dist/ArrowSetup-*.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArrowSetup-*.exe
